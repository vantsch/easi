repository_type: pipeline

nf_core_version: 4.0.2

lint: {}

template:
  org: nf-core
  name: easi
  description: EASI (Expression and Splicing Integration) is a Nextflow pipeline for
    reproducible analysis of bulk RNA-seq data with a focus on integrating gene expression
    and splicing events. The workflow supports quality control, preprocessing, alignment,
    quantification, differential expression, and splicing-aware analyses, enabling
    users to jointly explore transcriptome-wide changes in expression and alternative
    splicing.
  author: Vanessa Todorow
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - gpu
  is_nfcore: true
