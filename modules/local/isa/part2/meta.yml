name: isa_part2
description: Import Pfam domain predictions into an IsoformSwitchAnalyzeR object

keywords:
  - isoform-switching
  - alternative-splicing
  - pfam
  - protein-domains
  - isoformswitchanalyzer

tools:
  - isoformswitchanalyzer:
      description: Statistical identification and annotation of alternative isoform usage
      homepage: https://bioconductor.org/packages/IsoformSwitchAnalyzeR/
      documentation: https://bioconductor.org/packages/IsoformSwitchAnalyzeR/
      licence:
        - GPL-3.0

input:
  - - meta:
        type: map
        description: |
          Groovy map containing sample or contrast information.
          For example: [ id:'UHR_vs_HBR' ]

    - switchlist:
        type: file
        description: IsoformSwitchAnalyzeR object generated by ISA Part 1
        pattern: "switchlist_part1.rds"

    - pfam_isa:
        type: file
        description: |
          Pfam domain predictions formatted for import by
          IsoformSwitchAnalyzeR analyzePFAM().
        pattern: "*.pfam_isa.tsv"

output:
  switchlist:
    - - meta:
          type: map
          description: Groovy map containing sample or contrast information

      - "switchlist_part2.rds":
          type: file
          description: |
            Updated IsoformSwitchAnalyzeR object containing imported
            Pfam domain annotations.

  domain_analysis:
    - - meta:
          type: map
          description: Groovy map containing sample or contrast information

      - "isa_part2_domain_analysis.tsv":
          type: file
          description: Imported Pfam domain annotations from the updated ISA object

  isoform_features:
    - - meta:
          type: map
          description: Groovy map containing sample or contrast information

      - "isa_part2_isoform_features.tsv":
          type: file
          description: Updated isoform feature table containing Pfam annotation status

authors:
  - "@VanessaTodorow"

maintainers:
  - "@VanessaTodorow"