name: pfam_format_isa
description: Convert HMMER Pfam domain predictions into the tabular format accepted by IsoformSwitchAnalyzeR analyzePFAM

keywords:
  - pfam
  - hmmer
  - isoformswitchanalyzer
  - protein
  - domains
  - isoform-switching

tools:
  - python:
      description: General-purpose programming language
      homepage: https://www.python.org/
      documentation: https://docs.python.org/
      licence:
        - PSF-2.0

input:
  - - meta:
        type: map
        description: |
          Groovy map containing sample or contrast information.
          For example: [ id:'UHR_vs_HBR' ]

    - domtblout:
        type: file
        description: |
          Domain-level Pfam results generated by HMMER hmmscan using
          the --domtblout option.
        pattern: "*.pfam.domtblout"

  - - pfam_clans:
        type: file
        description: |
          Pfam family-to-clan mapping file.

          The file is downloaded from the current Pfam release:

              curl -O https://ftp.ebi.ac.uk/pub/databases/Pfam/current_release/Pfam-A.clans.tsv.gz
              gunzip Pfam-A.clans.tsv.gz

          It is used to add Pfam clan identifiers to the formatted
          IsoformSwitchAnalyzeR input.
        pattern: "Pfam-A.clans.tsv"

output:
  pfam_isa:
    - - meta:
          type: map
          description: Groovy map containing sample or contrast information

      - "*.pfam_isa.tsv":
          type: file
          description: |
            Pfam domain predictions formatted for import with
            IsoformSwitchAnalyzeR analyzePFAM.
          pattern: "*.pfam_isa.tsv"

  versions_python:
    - - process:
          type: string
          description: Nextflow process name

      - tool:
          type: string
          description: Software name

      - version:
          type: string
          description: Python version

authors:
  - "@VanessaTodorow"

maintainers:
  - "@VanessaTodorow"