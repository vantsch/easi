description: Perform differential splicing analysis on LeafCutter intron clusters.
keywords:
  - splicing
  - differential splicing
  - leafcutter
  - RNA-seq

tools:
  - leafcutter:
      description: Annotation-free detection and quantification of differential RNA splicing.
      homepage: https://davidaknowles.github.io/leafcutter/
      documentation: https://davidaknowles.github.io/leafcutter/
      tool_dev_url: https://github.com/davidaknowles/leafcutter
      doi: 10.1038/s41588-017-0004-9
      licence: ["MIT"]

input:
  - - meta:
        type: map
        description: |
          Groovy map containing comparison metadata.
          Example: `[ id:'UHR_vs_HBR' ]`
    - counts:
        type: file
        description: LeafCutter numerator counts generated by the clustering step.
        pattern: "*_perind_numers.counts.gz"
    - groups:
        type: file
        description: Tab-delimited sample group file.
        pattern: "*.txt"

output:
  - cluster_significance:
      - meta:
          type: map
          description: Groovy map containing comparison metadata.
      - "*_cluster_significance.txt":
          type: file
          description: Cluster-level differential splicing statistics.
          pattern: "*_cluster_significance.txt"

  - effect_sizes:
      - meta:
          type: map
          description: Groovy map containing comparison metadata.
      - "*_effect_sizes.txt":
          type: file
          description: Intron-level effect size estimates.
          pattern: "*_effect_sizes.txt"

  - plots:
      - meta:
          type: map
          description: Groovy map containing comparison metadata.
      - "*.pdf":
          type: file
          description: Optional diagnostic plots.
          pattern: "*.pdf"

  - versions_leafcutter:
      - process:
          type: string
          description: Fully qualified Nextflow process name.
      - tool:
          type: string
          description: Tool name.
      - version:
          type: string
          description: Installed LeafCutter version.

authors:
  - "@VanessaTodorow"

maintainers:
  - "@VanessaTodorow"