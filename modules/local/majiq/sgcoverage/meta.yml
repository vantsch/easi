name: majiq_sgcoverage
description: Generate splice graph coverage files from MAJIQ splice junction files
keywords:
  - majiq
  - splicing
  - splice graph
  - coverage

tools:
  - majiq:
      description: Modeling Alternative Junction Inclusion Quantification
      homepage: https://majiq.biociphers.org/

input:
  - condition:
      type: string
      description: Experimental group or condition name
  - sj_files:
      type: file
      description: MAJIQ splice junction files for all replicates in the condition
      pattern: "*.sj"
  - splicegraph:
      type: directory
      description: Updated MAJIQ splice graph
      pattern: "*.zarr"

output:
  - sgc_files:
      type: file
      description: MAJIQ splice graph coverage file
      pattern: "*.sgc"
  - versions_majiq:
      type: value
      description: MAJIQ version information