name: majiq_psicoverage
description: Calculate MAJIQ PSI coverage files for each experimental group
keywords:
  - majiq
  - splicing
  - psi
  - coverage

tools:
  - majiq:
      description: Modeling Alternative Junction Inclusion Quantification
      homepage: https://majiq.biociphers.org/

input:
  - condition:
      type: string
      description: Experimental group or condition name
  - sj:
      type: file
      description: MAJIQ splice-junction (.sj) files for all replicates in the condition
      pattern: "*.sj"
  - splicegraph:
      type: directory
      description: Updated MAJIQ splice graph
      pattern: "*.zarr"

output:
  - psi_coverage:
      type: file
      description: MAJIQ PSI coverage file
      pattern: "*.psicov"
  - versions_majiq:
      type: value
      description: MAJIQ version information