name: majiq_buildsj
description: Build a per-sample MAJIQ splice-junction file from an aligned BAM and a reference splice graph.
keywords:
  - splicing
  - splice junctions
  - bam
  - majiq
tools:
  - majiq:
      description: Modeling Alternative Junction Inclusion Quantification
      homepage: https://majiq.biociphers.org/
      documentation: https://majiq.biociphers.org/
      tool_dev_url: https://github.com/biociphers/majiq_academic
      licence: ["Academic"]

input:
  - - meta:
        type: map
        description: |
          Groovy map containing sample metadata.
          Example: `[ id:'sample1', condition:'control', replicate:1 ]`
    - bam:
        type: file
        description: Coordinate-sorted alignment file.
        pattern: "*.bam"
    - meta_splicegraph:
        type: map
        description: Groovy map containing reference splice-graph metadata.
        pattern: null
    - splicegraph:
        type: directory
        description: MAJIQ reference splice graph generated by MAJIQ_BUILDGFF3.
        pattern: "splicegraph.zarr"

output:
  - sj:
      - meta:
          type: map
          description: Groovy map containing sample metadata.
      - "build/sj/*.sj":
          type: file
          description: Per-sample MAJIQ splice-junction file.
          pattern: "*.sj"

  - versions_majiq:
      - process:
          type: string
          description: Fully qualified Nextflow process name.
      - tool:
          type: string
          description: Tool name.
      - version:
          type: string
          description: Installed MAJIQ version.

authors:
  - "@VanessaTodorow"
maintainers:
  - "@VanessaTodorow"