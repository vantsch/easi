name: majiq_quantify
description: Quantify local splicing variations from MAJIQ PSI coverage files
keywords:
  - majiq
  - splicing
  - psi
  - quantify

tools:
  - majiq:
      description: Modeling Alternative Junction Inclusion Quantification
      homepage: https://majiq.biociphers.org/

input:
  - condition:
      type: string
      description: Experimental group or condition name
  - psicov:
      type: file
      description: MAJIQ PSI coverage file
      pattern: "*.psicov"
  - splicegraph:
      type: directory
      description: Updated MAJIQ splice graph
      pattern: "*.zarr"

output:
  - psi_tsv:
      type: file
      description: Tab-separated table containing quantified PSI values
      pattern: "*.tsv"
  - versions_majiq:
      type: value
      description: MAJIQ version information